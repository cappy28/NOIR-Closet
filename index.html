<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NØIR Closet</title>
  <meta
    name="description"
    content="NØIR Closet — ton dressing personnel numérique."
  />

  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="chrome-noise"></div>

  <div class="app-shell">

    <aside class="sidebar">
      <button class="brand" data-route="overview">
        NØIR<span>.</span>
      </button>

      <div class="sidebar-label">
        PERSONAL WARDROBE
      </div>

      <nav class="navigation">
        <button class="nav-item active" data-route="overview">
          <span class="nav-symbol">⌂</span>
          <span>Overview</span>
        </button>

        <button class="nav-item" data-route="closet">
          <span class="nav-symbol">◫</span>
          <span>My Closet</span>
        </button>

        <button class="nav-item" data-route="outfits">
          <span class="nav-symbol">✦</span>
          <span>Outfit Lab</span>
        </button>

        <button class="nav-item" data-route="looks">
          <span class="nav-symbol">◈</span>
          <span>Saved Looks</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <span class="status-dot"></span>
        <div>
          <strong>Private space</strong>
          <small>Your wardrobe only</small>
        </div>
      </div>
    </aside>

    <main class="main-content">

      <header class="topbar">
        <div>
          <p class="topbar-overline">NØIR CLOSET</p>
          <p class="topbar-route" id="currentRoute">
            / overview
          </p>
        </div>

        <div class="topbar-right">
          <span class="local-status">
            LOCAL ARCHIVE
          </span>

          <div class="profile-avatar">
            N
          </div>
        </div>
      </header>

      <div id="app"></div>

    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="./js/app.js"></script>
</body>
  </html>
