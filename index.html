<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NØIR Closet</title>
  <meta
    name="description"
    content="NØIR Closet — ton dressing personnel numérique."
  />

  <link rel="stylesheet" href="./css/style.css?v=3" />

<link rel="manifest" href="./manifest.json" />

<meta name="theme-color" content="#050505" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
/>

</head>

<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <div class="chrome-noise"></div>

  <div class="app-shell">

    <aside class="sidebar">
      <button class="brand" data-route="overview">
        NØIR<span>.</span>
      </button>

      <div class="sidebar-label">
        PERSONAL WARDROBE
      </div>

      <nav class="navigation">
        <button class="nav-item active" data-route="overview">
          <span class="nav-symbol">⌂</span>
          <span>Overview</span>
        </button>

        <button class="nav-item" data-route="closet">
          <span class="nav-symbol">◫</span>
          <span>My Closet</span>
        </button>

        <button class="nav-item" data-route="outfits">
          <span class="nav-symbol">✦</span>
          <span>Outfit Lab</span>
        </button>

        <button class="nav-item" data-route="looks">
          <span class="nav-symbol">◈</span>
          <span>Saved Looks</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <span class="status-dot"></span>
        <div>
          <strong>Private space</strong>
          <small>Your wardrobe only</small>
        </div>
      </div>
    </aside>

    <main class="main-content">

      <header class="topbar">
        <div>
          <p class="topbar-overline">NØIR CLOSET</p>
          <p class="topbar-route" id="currentRoute">
            / overview
          </p>
        </div>

        <div class="topbar-right">
          <span class="local-status">
            LOCAL ARCHIVE
          </span>

          <div class="profile-avatar">
            N
          </div>
        </div>
      </header>

      <div id="app"></div>

    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module">
  import("./js/app.js?v=4")
    .catch((error) => {
      console.error(error);

      const app = document.getElementById("app");
      app.innerHTML = "";

      const box = document.createElement("div");

      box.style.cssText = `
        margin: 30px;
        padding: 24px;
        border: 1px solid #ff7777;
        border-radius: 16px;
        color: #ffffff;
        background: #1a0808;
        font-family: monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      `;

      box.textContent =
        "Erreur JavaScript NØIR Closet\\n\\n" +
        (error.stack || error.message || error);

      app.appendChild(box);
    });
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./sw.js")
        .catch(error => {
          console.error("Service Worker:", error);
        });
    });
  }
</script>
  
</body>
  </html>
