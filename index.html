<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta name="theme-color" content="#050505" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />

  <title>NØIR Closet</title>

  <meta
    name="description"
    content="Ton dressing personnel numérique."
  />
  <link
   rel="manifest"
   href="./manifest.json"
  />

  <meta
   name="theme-color"
   content="#050505"
  />

  <link
   rel="apple-touch-icon"
   href="./assets/icons/icon-192.png"
  />
  
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />

  <link
    rel="stylesheet"
    href="./css/style.css?v=11"
  />
</head>

<body>
  <div id="app"></div>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>

  <script type="module">
    import("./js/app.js?v=35")
      .catch((error) => {
        const app = document.getElementById("app");

        app.innerHTML = "";

        const errorBox = document.createElement("div");

        errorBox.style.cssText = `
          margin: 24px;
          padding: 22px;
          border: 1px solid #777;
          border-radius: 16px;
          color: #ffffff;
          background: #180909;
          font-family: monospace;
          font-size: 13px;
          line-height: 1.6;
          white-space: pre-wrap;
          overflow-wrap: anywhere;
        `;

        errorBox.textContent =
          "Erreur JavaScript NØIR Closet\n\n" +
          String(
            error.stack ||
            error.message ||
            error
          );

        app.appendChild(errorBox);

        console.error(error);
      });
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js?v=10")
          .catch((error) => {
            console.error(
              "Service Worker non enregistré :",
              error
            );
          });
      });
    }
  </script>
</body>
</html>
